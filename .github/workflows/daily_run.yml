name: Barbell Quant Daily Workflow

on:
  schedule:
    # Tutti i giorni feriali alle 14:00 UTC (prima dell'apertura dei mercati USA)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Permette di lanciarlo anche a mano col pulsante "Run workflow"

jobs:
  trading-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Fondamentale per permettere ad Actions di fare il "git push" finale

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # SOSTITUITO 'alpaca-trade-api' CON 'alpaca-py'
          pip install pandas numpy alpaca-py yfinance openpyxl requests

      - name: 1. Download Fondamentali SEC
        run: python aggiorna_fondamentali.py

      - name: 2. Calcolo Screener e Invio Ordini ad Alpaca
        env:
          ALPACA_API_KEY_MODEL_ONE: ${{ secrets.ALPACA_API_KEY_MODEL_ONE }}
          ALPACA_SECRET_KEY_MODEL_ONE: ${{ secrets.ALPACA_SECRET_KEY_MODEL_ONE }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py

      - name: 3. Salva Database aggiornato su GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Database_Quantitativo_Definitivo.xlsx
          git commit -m "Bot: Aggiornamento Fondamentali SEC" || echo "Nessuna modifica da salvare"
          git push
