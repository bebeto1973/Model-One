name: Daily Barbell Quant Rebalance

on:
  # Esecuzione programmata (Cron usa UTC)
  # Minuto 30, Ora 19 (UTC), Tutti i giorni del mese, Tutti i mesi, Da Lunedì(1) a Venerdì(5)
  schedule:
    - cron: '30 19 * * 1-5'
  
  # Questo comando ti permette di lanciare lo script anche a mano 
  # premendo un pulsante "Run workflow" direttamente dalla pagina GitHub
  workflow_dispatch:

jobs:
  execute-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout della repository
        uses: actions/checkout@v4

      - name: 2. Setup di Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Installazione Librerie
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Esecuzione Barbell Master Screener
        env:
          # Qui GitHub inietta automaticamente i Secrets che hai salvato nelle impostazioni
          ALPACA_API_KEY_MODEL_ONE: ${{ secrets.ALPACA_API_KEY_MODEL_ONE }}
          ALPACA_SECRET_KEY_MODEL_ONE: ${{ secrets.ALPACA_SECRET_KEY_MODEL_ONE }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py
